name: Collect live-1h

# Stündliche Live-Snapshots (Open-Meteo-Modellraster openmeteo/global.json) -> Bucket orbis-live.
# Started by the clock worker (workers/clock) via repository_dispatch, type `live-1h` (minute 12, every 2 hours on even UTC hours); manually via "Run workflow".
# No schedule here: the Cloudflare cron is the clock. Collector: collectors/fetch-data.ts --group live-1h.
# Needs the orbis checkout (shared helpers in src/api), see README.

on:
  repository_dispatch:
    types: [live-1h]
  workflow_dispatch:
    inputs:
      orbis_ref:
        description: 'Branch/Tag/SHA von malte9799/orbis für die gemeinsamen Loader'
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: live-1h
  cancel-in-progress: false

env:
  ORBIS_REF: ${{ github.event.inputs.orbis_ref || github.event.client_payload.orbis_ref || 'main' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: malte9799/orbis
          ref: ${{ env.ORBIS_REF }}
          path: orbis
          sparse-checkout: |
            src
            public/data/games
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect live-1h
        run: |
          pnpm exec node collectors/build.mjs
          node dist/fetch-data.mjs --group live-1h --out out
      - name: Upload to R2 (orbis-live)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          collectors/upload.sh out orbis-live "public, max-age=1800, stale-while-revalidate=7200"
