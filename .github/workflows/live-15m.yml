name: Collect live-15m

# Live-Snapshots alle 15 min (Safecast, BfS-ODL + EURDEP, FIRMS, Demos) -> Bucket orbis-live.
# Started by the clock worker (workers/clock) via repository_dispatch, type `live-15m`; manually via "Run workflow".
# No schedule here: the Cloudflare cron is the clock. Collector: collectors/fetch-data.ts --group live-15m.
# Needs the orbis checkout (shared loaders in src/api), see README.

on:
  repository_dispatch:
    types: [live-15m]
  workflow_dispatch:
    inputs:
      orbis_ref:
        description: 'Branch/Tag/SHA von malte9799/orbis für die gemeinsamen Loader'
        type: string
        default: main
      force_celestrak:
        description: 'CelesTrak-TLEs jetzt abrufen (sonst nur im :07-Lauf geradzahliger UTC-Stunden)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-15m
  cancel-in-progress: false

env:
  ORBIS_REF: ${{ github.event.inputs.orbis_ref || github.event.client_payload.orbis_ref || 'main' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: malte9799/orbis
          ref: ${{ env.ORBIS_REF }}
          path: orbis
          sparse-checkout: |
            src
            public/data/games
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect live-15m
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
          WINDY_KEY: ${{ secrets.WINDY_KEY }}
          VICTORIA_KEY: ${{ secrets.VICTORIA_KEY }}
          CTA_KEY: ${{ secrets.CTA_KEY }}
          TRAFIKLAB_KEY: ${{ secrets.TRAFIKLAB_KEY }}
          TRAFIKVERKET_KEY: ${{ secrets.TRAFIKVERKET_KEY }}
          UTAH_511_API_KEY: ${{ secrets.UTAH_511_API_KEY }}
          ARIZONA_511_API_KEY: ${{ secrets.ARIZONA_511_API_KEY }}
          IDAHO_511_API_KEY: ${{ secrets.IDAHO_511_API_KEY }}
          NEVADA_511_API_KEY: ${{ secrets.NEVADA_511_API_KEY }}
          ALASKA_511_API_KEY: ${{ secrets.ALASKA_511_API_KEY }}
          GEORGIA_511_API_KEY: ${{ secrets.GEORGIA_511_API_KEY }}
          LOUISIANA_511_API_KEY: ${{ secrets.LOUISIANA_511_API_KEY }}
          PENNSYLVANIA_511_API_KEY: ${{ secrets.PENNSYLVANIA_511_API_KEY }}
          OHGO_API_KEY: ${{ secrets.OHGO_API_KEY }}
          QLDTRAFFIC_KEY: ${{ secrets.QLDTRAFFIC_KEY }}
          ONTARIO_511_API_KEY: ${{ secrets.ONTARIO_511_API_KEY }}
          ALBERTA_511_API_KEY: ${{ secrets.ALBERTA_511_API_KEY }}
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN || vars.MAPILLARY_TOKEN }}
        run: |
          pnpm exec node collectors/build.mjs
          node dist/fetch-data.mjs --group live-15m --out out ${{ github.event.inputs.force_celestrak == 'true' && '--force-celestrak' || '' }}
      - name: Upload to R2 (orbis-live)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: collectors/upload.sh out orbis-live "public, max-age=300, stale-while-revalidate=1800" \
          --cache-prefix "space/tle/=public, max-age=3600, stale-while-revalidate=14400"
