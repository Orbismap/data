name: BarentsWatch loop

# Central BarentsWatch fetch for the ships of Orbis (Norway): latest/combined every 60 s -> orbis-live/ais/barentswatch-latest.json.
# Started by the clock worker (workers/clock) via repository_dispatch, type `barentswatch`, every hour; manually via "Run workflow".
# No schedule here: the Cloudflare cron is the clock. Collector: collectors/barentswatch-loop.mjs (runs ~5 h 50 min, then exits).
# Concurrency group: a dispatch during a running loop waits (GitHub keeps ONE pending run) and starts when the loop ends.

on:
  repository_dispatch:
    types: [barentswatch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barentswatch
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: BarentsWatch loop
        env:
          BARENTSWATCH_CLIENT_ID: ${{ secrets.BARENTSWATCH_CLIENT_ID }}
          BARENTSWATCH_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_CLIENT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          LOOP_MINUTES: 350
          INTERVAL_S: 60
        run: node collectors/barentswatch-loop.mjs --out out/ais
