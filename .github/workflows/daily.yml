name: Collect daily

# Tägliche Sammler (Ukraine/Gaza-Sets, Vulkane, Radio, OSM-Kabel, Mars, Cams) -> Bucket orbis-data, dazu meta.json.
# Started by the clock worker (workers/clock) via repository_dispatch, type `daily`; manually via "Run workflow".
# No schedule here: the Cloudflare cron is the clock. Collector: collectors/fetch-data.ts --group daily.
# Needs the orbis checkout (shared loaders in src/api), see README.

on:
  repository_dispatch:
    types: [daily]
  workflow_dispatch:
    inputs:
      orbis_ref:
        description: 'Branch/Tag/SHA von malte9799/orbis für die gemeinsamen Loader'
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

env:
  ORBIS_REF: ${{ github.event.inputs.orbis_ref || github.event.client_payload.orbis_ref || 'main' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: malte9799/orbis
          ref: ${{ env.ORBIS_REF }}
          path: orbis
          sparse-checkout: |
            src
            public/data/games
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # cams-world merges all cams/*.json: feeds that fail or need a key keep their file from the last run
      - name: Previous camera snapshots
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_DEFAULT_REGION: auto
        run: |
          mkdir -p out/cams
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$AWS_ACCESS_KEY_ID" ]; then
            aws s3 sync s3://orbis-data/cams out/cams --exclude world.json --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors || echo '::warning::previous camera snapshots not available'
          fi
      - name: Collect daily
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
          WINDY_KEY: ${{ secrets.WINDY_KEY }}
          VICTORIA_KEY: ${{ secrets.VICTORIA_KEY }}
          CTA_KEY: ${{ secrets.CTA_KEY }}
          TRAFIKLAB_KEY: ${{ secrets.TRAFIKLAB_KEY }}
          TRAFIKVERKET_KEY: ${{ secrets.TRAFIKVERKET_KEY }}
          UTAH_511_API_KEY: ${{ secrets.UTAH_511_API_KEY }}
          ARIZONA_511_API_KEY: ${{ secrets.ARIZONA_511_API_KEY }}
          IDAHO_511_API_KEY: ${{ secrets.IDAHO_511_API_KEY }}
          NEVADA_511_API_KEY: ${{ secrets.NEVADA_511_API_KEY }}
          ALASKA_511_API_KEY: ${{ secrets.ALASKA_511_API_KEY }}
          GEORGIA_511_API_KEY: ${{ secrets.GEORGIA_511_API_KEY }}
          LOUISIANA_511_API_KEY: ${{ secrets.LOUISIANA_511_API_KEY }}
          PENNSYLVANIA_511_API_KEY: ${{ secrets.PENNSYLVANIA_511_API_KEY }}
          OHGO_API_KEY: ${{ secrets.OHGO_API_KEY }}
          QLDTRAFFIC_KEY: ${{ secrets.QLDTRAFFIC_KEY }}
          ONTARIO_511_API_KEY: ${{ secrets.ONTARIO_511_API_KEY }}
          ALBERTA_511_API_KEY: ${{ secrets.ALBERTA_511_API_KEY }}
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN || vars.MAPILLARY_TOKEN }}
        run: |
          pnpm exec node collectors/build.mjs
          node dist/fetch-data.mjs --group daily --out out
      - name: Upload to R2 (orbis-data)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: collectors/upload.sh out orbis-data "public, max-age=3600, stale-while-revalidate=86400"
