name: OSM tiles

# OSM-Daten (Kameras/CCTV, Blitzer, ALPR, Webcams, Windräder, Ressourcen, Bäume, Dächer) als PMTiles, eine Datei je Thema weltweit
# (collectors/osm-tiles.mjs, Themen-Registry collectors/osm-themes.mjs). Läuft täglich (Dispatch der Uhr, type `osm-tiles`):
#   plan     Geofabrik-Index (index-v1.json) -> 57 EINHEITEN: von oben nach unten die jeweils größte Region, deren PBF höchstens 20 GB hat
#            (Größentabelle collectors/osm-sizes.json), größere werden in ihre Unterregionen zerlegt. Wählt die ältesten Einheiten, die älter
#            als 30 Tage sind (ein Dreißigstel aller Einheiten je Lauf = rollierend, 2 am Tag), oder bei `all_regions` die 40 ältesten (Erstlauf: 2 Läufe).
#            Alter einer Einheit = Upload-Zeit ihres Assets `<einheit>.f<FORMAT>.points.tar` im Release osm-src-points
#   extract  Matrix-Job je Einheit (höchstens 5 parallel): lädt den Auszug (ein Download, mit Wiederholung und Wartezeit, Retry-After wird
#            beachtet), schreibt die Zwischendateien, baut daraus mit tippecanoe die REGIONAL-PMTiles und lädt sie nacheinander als Assets
#            in die GitHub-Releases osm-src-points (ein tar je Einheit mit den sechs Punktsätzen, zuletzt: das ist der Zustand),
#            osm-src-trees und osm-src-roofs (je Release höchstens 1000 Assets, je Asset höchstens 2 GB)
#            Gelingt kein Verbindungsaufbau zu Geofabrik (curl Exit 6/7: die Adresse des Runners ist gesperrt, Warten hilft nicht), gibt der
#            Job nach 3 Versuchen auf (Exit 75 `geofabrik-unreachable`); `retry-plan` sammelt diese Einheiten, `extract-retry` baut sie auf
#            frischen Runnern ein zweites Mal (dort ist ein Fehler endgültig)
#   merge    prüft, dass für ALLE Einheiten ein Stück des aktuellen FORMAT vorliegt (sonst wird nichts veröffentlicht: nach einer FORMAT-Änderung
#            bleiben die Welt-Dateien im Bucket, bis alle Einheiten neu gebaut sind), lädt die Stücke, führt sie je Thema mit tile-join zur
#            Welt-Datei zusammen (<thema>-<datum>.pmtiles, Verweis in meta.json), lädt sie nach orbis-osm und löscht abgelöste Versionen,
#            sobald die CDN-Cachezeit (24 h) vorbei ist. Im Dauerzustand liegt je Thema genau eine Datei im Bucket.
# In R2 liegen nur die fertigen Welt-Dateien (+ heat/cctv.json, meta.json, LICENSE.txt), die Zwischenstücke nur in den Releases.
# R2-Zugangsdaten sind für `merge` Pflicht; `plan` und `extract` brauchen nur das GitHub-Token.
# Erster Lauf / nach einer FORMAT-Änderung: `all_regions` aktivieren und so oft wiederholen, bis alle Einheiten gebaut sind (je Lauf 40, die
# ältesten zuerst); die Läufe davor enden mit einem übersprungenen merge, erst der letzte veröffentlicht.

on:
  repository_dispatch:
    types: [osm-tiles]
  workflow_dispatch:
    inputs:
      region:
        description: 'Region erzwingen (Schlüssel wie europe_germany_hessen, siehe Plan-Log) - leer: die ältesten fälligen'
        type: string
        default: ''
      all_regions:
        description: 'Alle Einheiten bauen (höchstens 40 je Lauf, die ältesten zuerst), z. B. beim ersten Lauf; wiederholen, bis alle gebaut sind'
        type: boolean
        default: false
      merge_only:
        description: 'Nur zusammenführen (aus den vorhandenen Regional-Stücken), keine Region bauen'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: osm-tiles
  cancel-in-progress: false

env:
  # R2 versteht die neuen Prüfsummen-Header der AWS-CLI nicht
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_DEFAULT_REGION: auto
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # creates the releases osm-src-* once (the extract jobs only upload)
    outputs:
      regions: ${{ steps.plan.outputs.regions }}
      units: ${{ steps.plan.outputs.units }}
      releases: ${{ steps.plan.outputs.releases }}
    env:
      REGION: ${{ github.event.inputs.region || github.event.client_payload.region || '' }}
      ALL_REGIONS: ${{ github.event.inputs.all_regions || github.event.client_payload.all_regions || 'false' }}
      MERGE_ONLY: ${{ github.event.inputs.merge_only || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan
        id: plan
        run: |
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 20 -A "Orbis-data/1.0 (+https://github.com/${GITHUB_REPOSITORY})" -o index.json https://download.geofabrik.de/index-v1.json
          # all units (merge checks that every one has a piece)
          echo "units=$(node collectors/osm-tiles.mjs units index.json)" >> "$GITHUB_OUTPUT"
          if [ "$MERGE_ONLY" = "true" ]; then echo 'regions=[]' >> "$GITHUB_OUTPUT"; exit 0; fi
          # the releases exist (created here, once) and their ids go to the extract jobs: they spare themselves the lookups (API rate limit)
          ids='{}'
          for g in points trees roofs; do
            gh release view "osm-src-$g" >/dev/null 2>&1 \
              || gh release create "osm-src-$g" --prerelease --title "OSM regional pieces: $g" \
                   --notes "Regional PMTiles of the osm-tiles workflow (group $g), merged to the world files by its merge job. Data © OpenStreetMap contributors (ODbL)."
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/osm-src-$g" --jq .id)
            ids=$(echo "$ids" | jq -c --arg g "$g" --argjson id "$id" '. + {($g): $id}')
          done
          echo "releases=$ids" >> "$GITHUB_OUTPUT"
          # age of the units: assets of the state release (missing yet: all units count as due)
          if id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/osm-src-points" --jq .id 2>/dev/null); then
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/$id/assets" --jq '.[]' | jq -s '{assets: .}' > assets.json
          else
            echo '{"assets":[]}' > assets.json
            echo '::notice::release osm-src-points does not exist yet - all units count as due'
          fi
          ARG="$REGION"
          if [ "$ALL_REGIONS" = "true" ]; then ARG=all; fi
          REGIONS=$(node collectors/osm-tiles.mjs plan index.json assets.json $ARG)
          echo "regions=$REGIONS" >> "$GITHUB_OUTPUT"
          echo "units to refresh: $REGIONS"
          echo "### plan: $(echo "$REGIONS" | jq length) of $(echo "$(node collectors/osm-tiles.mjs units index.json)" | jq length) units to build" >> "$GITHUB_STEP_SUMMARY"
      # the extract jobs take the index from here instead of all asking Geofabrik for it
      - uses: actions/upload-artifact@v4
        with:
          name: geofabrik-index
          path: index.json
          retention-days: 1
          if-no-files-found: ignore

  extract:
    needs: plan
    if: ${{ needs.plan.outputs.regions != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write # releases osm-src-*
    strategy:
      fail-fast: false
      # few at a time: Geofabrik and the GitHub API (uploads) refuse bursts
      max-parallel: 5
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: ex
        uses: ./.github/actions/osm-extract
        with:
          region: ${{ matrix.region }}
          releases: ${{ needs.plan.outputs.releases }}
      # Geofabrik cannot be reached from this runner: remember the unit, retry-plan collects them for a second round on other runners
      - if: steps.ex.outputs.unreachable == 'true'
        run: mkdir retry && echo "${{ matrix.region }}" > "retry/${{ matrix.region }}.txt"
      - if: steps.ex.outputs.unreachable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: retry-${{ matrix.region }}
          path: retry/
          retention-days: 1

  # Second round for the units whose extract found no connection to Geofabrik (a blocked address of a runner stays blocked, so waiting in the
  # same job is useless; a new job gets a new runner). One round only: what fails here fails the run, a new start with `region` repeats it.
  retry-plan:
    needs: [plan, extract]
    if: ${{ !cancelled() && needs.plan.outputs.regions != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true # no artifact = nothing to repeat
        with:
          pattern: retry-*
          path: retry
          merge-multiple: true
      - id: list
        run: |
          regions=$(cat retry/*.txt 2>/dev/null | jq -R . | jq -sc . || true)
          echo "regions=${regions:-[]}" >> "$GITHUB_OUTPUT"
          echo "second round: ${regions:-[]}"

  extract-retry:
    needs: [plan, retry-plan]
    if: ${{ !cancelled() && needs.retry-plan.outputs.regions != '' && needs.retry-plan.outputs.regions != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write # releases osm-src-*
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        region: ${{ fromJSON(needs.retry-plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/osm-extract
        with:
          region: ${{ matrix.region }}
          releases: ${{ needs.plan.outputs.releases }}
          final: 'true'

  merge:
    needs: [plan, extract, retry-plan, extract-retry]
    # also when single regions failed (the others are in the releases), but never without a plan (no unit list = nothing to check against)
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.regions != '[]' || github.event.inputs.merge_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/tippecanoe
      - name: Check coverage (a piece of the current format for every unit)
        id: cov
        env:
          UNITS: ${{ needs.plan.outputs.units }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo '::error::R2 credentials missing - the world files go to the bucket orbis-osm'
            exit 1
          fi
          mkdir -p work
          echo "$UNITS" > work/units.json
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/osm-src-points" --jq .id 2>/dev/null) || id=""
          if [ -n "$id" ]; then gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/$id/assets" --jq '.[].name' > work/names.txt; else : > work/names.txt; fi
          node collectors/osm-tiles.mjs coverage work/units.json work/names.txt > work/coverage.json
          format=$(jq -r .format work/coverage.json); total=$(jq -r .total work/coverage.json); n=$(jq '.missing | length' work/coverage.json)
          echo "format=$format" >> "$GITHUB_OUTPUT"
          if [ "$n" = 0 ]; then
            echo "all $total units have a piece of format $format"
            echo 'skip=false' >> "$GITHUB_OUTPUT"; echo 'complete=true' >> "$GITHUB_OUTPUT"
            echo "### merge: all $total units covered, world files published" >> "$GITHUB_STEP_SUMMARY"
          else
            first=$(jq -r '.missing[:5] | join(" ")' work/coverage.json)
            echo "::warning::$n of $total units have no piece of format $format yet (first: $first)"
            echo "::notice::merge skipped - the world files in the bucket stay as they are until all units are built (all_regions, repeat)"
            echo 'skip=true' >> "$GITHUB_OUTPUT"; echo 'complete=false' >> "$GITHUB_OUTPUT"
            echo "### merge skipped: $n of $total units still missing (format $format)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Regional pieces of all units (releases osm-src-*)
        if: steps.cov.outputs.skip != 'true'
        run: |
          FORMAT=${{ steps.cov.outputs.format }}
          mkdir -p work/assets
          for g in points trees roofs; do
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/osm-src-$g" --jq .id 2>/dev/null) || continue
            for i in 1 2 3 4 5; do
              gh release download "osm-src-$g" --pattern "*.f$FORMAT.*" --dir work/assets --clobber && break
              echo "download of osm-src-$g failed ($i/5), waiting"; sleep $((i * 60))
            done
          done
          echo "assets: $(ls work/assets | wc -l)"
          du -sh work/assets
      - name: Merge (tile-join)
        if: steps.cov.outputs.skip != 'true'
        run: |
          aws s3 cp s3://orbis-osm/meta.json work/prev-meta.json --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors || echo '::notice::no meta.json in the bucket yet'
          node collectors/osm-tiles.mjs merge work/assets dist --prev work/prev-meta.json --delete-list work/delete.txt --units work/units.json
          mkdir meta && mv dist/meta.json meta/meta.json # uploaded last
          ls -laR dist
      - name: Upload to R2 (orbis-osm)
        if: steps.cov.outputs.skip != 'true'
        run: |
          # new versions first (new names: nothing is overwritten, the live ones keep working), meta.json (the reference) last
          collectors/upload.sh dist orbis-osm "public, max-age=86400"
          aws s3 cp meta/meta.json s3://orbis-osm/meta.json --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --cache-control "public, max-age=3600" --content-type application/json --only-show-errors
      - name: Delete superseded versions (older than the CDN cache time)
        if: steps.cov.outputs.skip != 'true'
        run: |
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          [ -s work/delete.txt ] || { echo 'nothing to delete'; exit 0; }
          while read -r key; do
            echo "delete $key"
            aws s3 rm "s3://orbis-osm/$key" --endpoint-url "$EP" --only-show-errors
          done < work/delete.txt
          aws s3 cp s3://orbis-osm/manifest.json work/manifest.json --endpoint-url "$EP" --only-show-errors
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('work/manifest.json', 'utf8'));
            for (const k of fs.readFileSync('work/delete.txt', 'utf8').split('\n').filter(Boolean)) delete m[k];
            fs.writeFileSync('work/manifest.json', JSON.stringify(m));
          "
          aws s3 cp work/manifest.json s3://orbis-osm/manifest.json --endpoint-url "$EP" \
            --cache-control "public, max-age=60, stale-while-revalidate=300" --content-type application/json --only-show-errors
      - name: Remove regional pieces of older formats (only when every unit has a current piece)
        if: steps.cov.outputs.complete == 'true' && steps.cov.outputs.skip != 'true'
        run: |
          FORMAT=${{ steps.cov.outputs.format }}
          for g in points trees roofs; do
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/osm-src-$g" --jq .id 2>/dev/null) || continue
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/$id/assets" --jq '.[] | "\(.id) \(.name)"' \
              | awk -v cur=".f$FORMAT." 'index($2, cur) == 0 { print $1 }' \
              | while read -r aid; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$aid"; done
          done
