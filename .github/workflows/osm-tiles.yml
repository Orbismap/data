name: OSM tiles

# OSM-Daten (Kameras/CCTV, Blitzer, ALPR, Webcams, Windräder, Ressourcen, Bäume, Dächer) als PMTiles, eine Datei je Thema weltweit
# (collectors/osm-tiles.mjs, Themen-Registry collectors/osm-themes.mjs). Läuft täglich (Dispatch der Uhr, type `osm-tiles`):
#   plan     Geofabrik-Index (index-v1.json) -> ca. 500 Regionen (Länder/Unterregionen, je < 1,2 GB); wählt die ältesten, die älter als
#            30 Tage sind (ein Dreißigstel aller Regionen je Lauf = rollierend), oder alle bei `all_regions` (höchstens 250 je Lauf).
#            Alter einer Region = Upload-Zeit ihres Assets `<region>.f<FORMAT>.points.tar` im Release osm-src-points
#   extract  Matrix-Job je 5 Regionen (nacheinander, Platte dazwischen geleert): lädt den Auszug, schreibt die Zwischendateien, baut daraus mit tippecanoe die REGIONAL-PMTiles und
#            lädt sie als Assets in die GitHub-Releases osm-src-points (ein tar je Region mit den sechs Punktsätzen, zuletzt: das ist
#            der Zustand), osm-src-trees und osm-src-roofs (je Release höchstens 1000 Assets, je Asset höchstens 2 GB)
#   merge    lädt die Regional-Stücke ALLER Regionen, führt sie je Thema mit tile-join zur Welt-Datei zusammen
#            (<thema>-<datum>.pmtiles, Verweis in meta.json), lädt sie nach orbis-osm und löscht abgelöste Versionen, sobald die
#            CDN-Cachezeit (24 h) vorbei ist. Im Dauerzustand liegt je Thema genau eine Datei im Bucket.
# In R2 liegen nur die fertigen Welt-Dateien (+ heat/cctv.json, meta.json, LICENSE.txt), die Zwischenstücke nur in den Releases.
# R2-Zugangsdaten sind für `merge` Pflicht; `plan` und `extract` brauchen nur das GitHub-Token.
# Erster Lauf: `all_regions` aktivieren und so oft wiederholen, bis alle Regionen gebaut sind (je Lauf 250, die ältesten zuerst).

on:
  repository_dispatch:
    types: [osm-tiles]
  workflow_dispatch:
    inputs:
      region:
        description: 'Region erzwingen (Schlüssel wie europe_germany_hessen, siehe Plan-Log) - leer: die ältesten fälligen'
        type: string
        default: ''
      all_regions:
        description: 'Alle Regionen bauen (höchstens 250 je Lauf, die ältesten zuerst), z. B. beim ersten Lauf'
        type: boolean
        default: false
      merge_only:
        description: 'Nur zusammenführen (aus den vorhandenen Regional-Stücken), keine Region bauen'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: osm-tiles
  cancel-in-progress: false

env:
  # R2 versteht die neuen Prüfsummen-Header der AWS-CLI nicht
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_DEFAULT_REGION: auto
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # creates the releases osm-src-* once (the extract jobs only upload)
    outputs:
      regions: ${{ steps.plan.outputs.regions }}
      batches: ${{ steps.plan.outputs.batches }}
      releases: ${{ steps.plan.outputs.releases }}
    env:
      REGION: ${{ github.event.inputs.region || github.event.client_payload.region || '' }}
      ALL_REGIONS: ${{ github.event.inputs.all_regions || github.event.client_payload.all_regions || 'false' }}
      MERGE_ONLY: ${{ github.event.inputs.merge_only || 'false' }}
      BATCH_SIZE: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan
        id: plan
        run: |
          if [ "$MERGE_ONLY" = "true" ]; then echo 'regions=[]' >> "$GITHUB_OUTPUT"; exit 0; fi
          # the releases exist (created here, once) and their ids go to the extract jobs: they spare themselves the lookups (API rate limit)
          ids='{}'
          for g in points trees roofs; do
            gh release view "osm-src-$g" >/dev/null 2>&1 \
              || gh release create "osm-src-$g" --prerelease --title "OSM regional pieces: $g" \
                   --notes "Regional PMTiles of the osm-tiles workflow (group $g), merged to the world files by its merge job. Data © OpenStreetMap contributors (ODbL)."
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/osm-src-$g" --jq .id)
            ids=$(echo "$ids" | jq -c --arg g "$g" --argjson id "$id" '. + {($g): $id}')
          done
          echo "releases=$ids" >> "$GITHUB_OUTPUT"
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 20 -A "Orbis-data/1.0 (+https://github.com/${GITHUB_REPOSITORY})" -o index.json https://download.geofabrik.de/index-v1.json
          # Alter der Regionen: Assets des Zustand-Releases (fehlt es noch: alle Regionen gelten als fällig)
          if id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/osm-src-points" --jq .id 2>/dev/null); then
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/$id/assets" --jq '.[]' | jq -s '{assets: .}' > assets.json
          else
            echo '{"assets":[]}' > assets.json
            echo '::notice::release osm-src-points does not exist yet - all regions count as due'
          fi
          ARG="$REGION"
          if [ "$ALL_REGIONS" = "true" ]; then ARG=all; fi
          REGIONS=$(node collectors/osm-tiles.mjs plan index.json assets.json $ARG)
          echo "regions=$REGIONS" >> "$GITHUB_OUTPUT"
          # several regions per extract job (one after the other, the disk is cleaned in between): saves the runner setup and API load per region
          echo "batches=$(echo "$REGIONS" | jq -c --argjson n "$BATCH_SIZE" '[_nwise($n) | join(" ")]')" >> "$GITHUB_OUTPUT"
          echo "regions to refresh: $REGIONS"
      # the extract jobs take the index from here instead of all asking Geofabrik for it (hundreds of parallel requests got refused)
      - uses: actions/upload-artifact@v4
        with:
          name: geofabrik-index
          path: index.json
          retention-days: 1
          if-no-files-found: ignore

  extract:
    needs: plan
    if: ${{ needs.plan.outputs.regions != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360 # a batch of several regions
    permissions:
      contents: write # releases osm-src-*
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y --no-install-recommends osmium-tool
      - uses: ./.github/actions/tippecanoe
      - uses: actions/download-artifact@v4
        with:
          name: geofabrik-index
      - name: Extract, build and upload the regions of this batch
        env:
          RELEASES: ${{ needs.plan.outputs.releases }}
        run: |
          upload() {
            # roofs and trees first, the points tar last: it is the state `plan` looks at, so a failed upload does not count as refreshed
            for g in roofs trees points; do
              for f in out/upload/*."$g".*; do
                [ -e "$f" ] || continue
                collectors/osm-release-upload.sh "$GITHUB_REPOSITORY" "$(echo "$RELEASES" | jq -r ".$g")" "$f" || return 1
              done
            done
          }
          failed=""
          for region in ${{ matrix.batch }}; do
            echo "::group::$region"
            if node collectors/osm-tiles.mjs extract out "$region" --index index.json \
              && node collectors/osm-tiles.mjs regional out "$region" \
              && ls -la out/upload \
              && upload; then :; else
              echo "::error::region $region failed"
              failed="$failed $region"
            fi
            rm -rf out # the runner disk is limited: clean before the next region
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::failed regions:$failed"; exit 1; }

  merge:
    needs: [plan, extract]
    # also when single regions failed: the others are in the releases and the world files are built from what exists
    if: ${{ !cancelled() && (needs.plan.outputs.regions != '[]' || github.event.inputs.merge_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/tippecanoe
      - name: Regional pieces of all regions (releases osm-src-*)
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo '::error::R2 credentials missing - the world files go to the bucket orbis-osm'
            exit 1
          fi
          FORMAT=$(node -e "import('./collectors/osm-tiles.mjs').then(m => console.log(m.FORMAT))")
          mkdir -p work/assets
          expected=0
          for g in points trees roofs; do
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/osm-src-$g" --jq .id 2>/dev/null) || continue
            n=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/$id/assets" --jq '.[].name' | grep -c "\.f$FORMAT\." || true)
            expected=$((expected + n))
            gh release download "osm-src-$g" --pattern "*.f$FORMAT.*" --dir work/assets --clobber
          done
          have=$(ls work/assets | wc -l)
          echo "assets: $have of $expected"
          [ "$have" -eq "$expected" ] || { echo '::error::not all regional pieces were downloaded'; exit 1; }
          du -sh work/assets
      - name: Merge (tile-join)
        run: |
          aws s3 cp s3://orbis-osm/meta.json work/prev-meta.json --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors || echo '::notice::no meta.json in the bucket yet'
          node collectors/osm-tiles.mjs merge work/assets dist --prev work/prev-meta.json --delete-list work/delete.txt
          mkdir meta && mv dist/meta.json meta/meta.json # uploaded last
          ls -laR dist
      - name: Upload to R2 (orbis-osm)
        run: |
          # new versions first (new names: nothing is overwritten, the live ones keep working), meta.json (the reference) last
          collectors/upload.sh dist orbis-osm "public, max-age=86400"
          aws s3 cp meta/meta.json s3://orbis-osm/meta.json --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --cache-control "public, max-age=3600" --content-type application/json --only-show-errors
      - name: Delete superseded versions (older than the CDN cache time)
        run: |
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          [ -s work/delete.txt ] || { echo 'nothing to delete'; exit 0; }
          while read -r key; do
            echo "delete $key"
            aws s3 rm "s3://orbis-osm/$key" --endpoint-url "$EP" --only-show-errors
          done < work/delete.txt
          aws s3 cp s3://orbis-osm/manifest.json work/manifest.json --endpoint-url "$EP" --only-show-errors
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('work/manifest.json', 'utf8'));
            for (const k of fs.readFileSync('work/delete.txt', 'utf8').split('\n').filter(Boolean)) delete m[k];
            fs.writeFileSync('work/manifest.json', JSON.stringify(m));
          "
          aws s3 cp work/manifest.json s3://orbis-osm/manifest.json --endpoint-url "$EP" \
            --cache-control "public, max-age=60, stale-while-revalidate=300" --content-type application/json --only-show-errors
      - name: Remove regional pieces of older formats
        run: |
          FORMAT=$(node -e "import('./collectors/osm-tiles.mjs').then(m => console.log(m.FORMAT))")
          for g in points trees roofs; do
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/osm-src-$g" --jq .id 2>/dev/null) || continue
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/$id/assets" --jq '.[] | "\(.id) \(.name)"' \
              | awk -v cur=".f$FORMAT." 'index($2, cur) == 0 { print $1 }' \
              | while read -r aid; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$aid"; done
          done
