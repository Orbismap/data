name: Airports (plans + indoor)

# Flughafen-Pläne + Indoor-Daten als JSON-Dateien im Bucket orbis-assets/data/airports/.
# Läuft wöchentlich (älteste fällige Region) oder manuell (region/all_regions). Pro Region ein Matrix-Job.
# Collectors: build-airportplan-osmium.mjs + build-indoor-osmium.mjs (osmium + Geofabrik-Extracts).

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region erzwingen (europe, russia, asia, north-america, central-america, south-america, africa, oceania) - leer: älteste fällige'
        type: string
        default: ''
      all_regions:
        description: 'Alle Regionen in einem Lauf bauen (z. B. beim ersten Lauf)'
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * 1'  # wöchentlich Montag 04:00 UTC

permissions:
  contents: read

concurrency:
  group: indoor
  cancel-in-progress: false

env:
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_DEFAULT_REGION: auto

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      regions: ${{ steps.plan.outputs.regions }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      REGION: ${{ github.event.inputs.region || '' }}
      ALL_REGIONS: ${{ github.event.inputs.all_regions || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan
        id: plan
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo '::error::R2 credentials missing'
            exit 1
          fi
          mkdir -p state
          aws s3 sync "s3://orbis-assets/data/airports/.state" state --exclude "*" --include "*.json" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors || echo '::notice::no state yet - all regions count as due'
          ARG="$REGION"
          if [ "$ALL_REGIONS" = "true" ]; then ARG=all; fi
          REGIONS=$(node collectors/airports-plan.mjs state "$ARG")
          echo "regions=$REGIONS" >> "$GITHUB_OUTPUT"
          echo "regions to refresh: $REGIONS"

  extract:
    needs: plan
    if: ${{ needs.plan.outputs.regions != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Download OSM PBF (${{ matrix.region }})
        run: |
          mkdir -p /tmp/osm-pbf
          PBF="/tmp/osm-pbf/${{ matrix.region }}-latest.osm.pbf"
          if [ ! -f "$PBF" ]; then
            case "${{ matrix.region }}" in
              europe) URL="https://download.geofabrik.de/europe-latest.osm.pbf" ;;
              russia) URL="https://download.geofabrik.de/russia-latest.osm.pbf" ;;
              asia) URL="https://download.geofabrik.de/asia-latest.osm.pbf" ;;
              north-america) URL="https://download.geofabrik.de/north-america-latest.osm.pbf" ;;
              central-america) URL="https://download.geofabrik.de/central-america-latest.osm.pbf" ;;
              south-america) URL="https://download.geofabrik.de/south-america-latest.osm.pbf" ;;
              africa) URL="https://download.geofabrik.de/africa-latest.osm.pbf" ;;
              oceania) URL="https://download.geofabrik.de/australia-oceania-latest.osm.pbf" ;;
            esac
            curl -L -o "$PBF" "$URL"
          else
            echo "PBF already cached: $PBF"
          fi
          echo "PBF_PATH=$PBF" >> "$GITHUB_ENV"
      - name: Filter PBF (aeroway + indoor + building:part)
        run: |
          FILTERED="/tmp/osm-pbf/${{ matrix.region }}-filtered.osm.pbf"
          if [ ! -f "$FILTERED" ]; then
            osmium tags-filter "$PBF_PATH" -o "$FILTERED" --overwrite nwr/aeroway nwr/indoor nwr/building:part
          else
            echo "Filtered PBF already cached: $FILTERED"
          fi
          echo "FILTERED_PATH=$FILTERED" >> "$GITHUB_ENV"
      - name: Build airport plans (${{ matrix.region }})
        run: node collectors/build-airportplan-osmium.mjs --pbf "$FILTERED_PATH" --region "${{ matrix.region }}" --skip-filter --skip-existing
      - name: Build indoor plans (${{ matrix.region }})
        run: node collectors/build-indoor.mjs --pbf "$FILTERED_PATH" --region "${{ matrix.region }}" --skip-filter --skip-existing
      - name: Upload to R2 (orbis-assets/data/airports)
        run: |
          if [ -d public/data/airports ]; then
            mkdir -p tmp-upload/data
            cp -R public/data/airports tmp-upload/data/airports
            collectors/upload.sh tmp-upload orbis-assets "public, max-age=2592000, stale-while-revalidate=604800"
            rm -rf tmp-upload
          else
            echo "No public/data/airports directory, nothing to upload."
          fi
      - name: Write state file
        run: |
          mkdir -p state-out/.state
          COUNT=$(ls public/data/airports/*.json 2>/dev/null | wc -l)
          echo "{\"region\":\"${{ matrix.region }}\",\"built\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"count\":$COUNT}" > "state-out/.state/${{ matrix.region }}.json"
          aws s3 cp "state-out/.state/${{ matrix.region }}.json" "s3://orbis-assets/data/airports/.state/${{ matrix.region }}.json" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --cache-control "no-store" --only-show-errors