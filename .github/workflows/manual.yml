name: Collect manual

# Selten wechselnde Quellen (Häfen) -> Bucket orbis-data. Nur per "Run workflow", kein Schedule, kein Dispatch.
# Collector: collectors/fetch-data.ts --group manual. Needs the orbis checkout (shared loaders in src/api), see README.

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Aufgabe: manual (fetch-data) oder indoor (Indoor-Pläne bauen)'
        type: choice
        options:
          - manual
          - indoor
        default: manual
      group:
        description: 'Sammler-Gruppe (nur bei task=manual)'
        type: string
        default: manual
      indoor_limit:
        description: 'Optional: max. Anzahl Flughäfen für Indoor-Build (nur task=indoor)'
        type: string
        default: ''
      orbis_ref:
        description: 'Branch/Tag/SHA von malte9799/orbis für die gemeinsamen Loader'
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: manual-${{ github.event.inputs.task || 'manual' }}
  cancel-in-progress: false

env:
  ORBIS_REF: ${{ github.event.inputs.orbis_ref || 'main' }}
  COLLECT_GROUP: ${{ github.event.inputs.group || 'manual' }}
  TASK: ${{ github.event.inputs.task || 'manual' }}
  INDOOR_LIMIT: ${{ github.event.inputs.indoor_limit || '' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/checkout@v4
        if: ${{ env.TASK == 'manual' }}
        with:
          repository: Orbismap/orbis
          ref: ${{ env.ORBIS_REF }}
          path: orbis
          sparse-checkout: |
            src
            public/data
      - name: Prepare airports.json for indoor
        if: ${{ env.TASK == 'indoor' }}
        run: |
          if [ ! -f public/data/airports.json ]; then
            echo "public/data/airports.json missing in data repo"
            exit 1
          fi
      - name: Collect manual
        if: ${{ env.TASK == 'manual' }}
        run: |
          pnpm exec node collectors/build.mjs
          node dist/fetch-data.mjs --group "$COLLECT_GROUP" --out out
      - name: Upload to R2 (orbis-data)
        if: ${{ env.TASK == 'manual' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: collectors/upload.sh out orbis-data "public, max-age=86400, stale-while-revalidate=604800"
      - name: Build indoor plans
        if: ${{ env.TASK == 'indoor' }}
        run: |
          if [ -n "$INDOOR_LIMIT" ]; then
            node collectors/build-indoor.mjs --limit "$INDOOR_LIMIT" --skip-existing
          else
            node collectors/build-indoor.mjs --skip-existing
          fi
      - name: Upload indoor to R2 (orbis-assets)
        if: ${{ env.TASK == 'indoor' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -d public/data/indoor ]; then
            collectors/upload.sh public/data/indoor orbis-assets "public, max-age=2592000, stale-while-revalidate=604800"
          else
            echo "No public/data/indoor directory, nothing to upload."
          fi
