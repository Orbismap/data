name: OSM planet

# OSM-Daten (Kameras/CCTV, Blitzer, ALPR, Webcams, Windräder, Ressourcen, Bäume, Dächer) als PMTiles, eine Datei je Thema weltweit
# (collectors/osm-tiles.mjs, Themen-Registry collectors/osm-themes.mjs). Läuft einmal im Monat (1. um 03:17 UTC) und auf Anforderung.
#   build    zwei Jobs parallel, je eigene Platte (der Planet ist ~90 GB, der Runner hat nach dem Aufräumen ~110 GB):
#              nodes = Gruppen points + trees (Punkte in einem gestreamten Durchgang, Baumreihen/Hecken in einem zweiten)
#              roofs = Gruppe roofs (osmium braucht die Datei auf der Platte, zwei Durchgänge)
#            Jeder Job lädt den Planeten (planet-latest.osm.pbf) vom ersten Mirror, der geht (gwdg ~145 MB/s, dann planet.openstreetmap.org,
#            dann fau), filtert, löscht den Planeten nach dem letzten Durchgang, baut mit tippecanoe die Welt-Dateien (<thema>-<datum>.pmtiles)
#            und lädt sie nach orbis-osm (neue Namen: nichts Laufendes wird überschrieben). meta.json wird dabei NICHT angefasst.
#   publish  nur wenn beide Jobs durch sind: führt deren Teil-Dateien zu meta.json zusammen (der Verweis, den die App liest), lädt sie als
#            letztes hoch und löscht abgelöste Versionen, sobald die CDN-Cachezeit (24 h) vorbei ist. Scheitert ein Job, bleibt meta.json
#            und damit der Stand der App unverändert (die neuen Dateien liegen dann ungenutzt im Bucket, der nächste Lauf ersetzt sie).
# In R2 liegen nur die fertigen Welt-Dateien (+ heat/cctv.json, meta.json, LICENSE.txt). R2-Zugangsdaten sind Pflicht.

on:
  # TEMPORARY (remove before the merge): every push to this branch is a DRY RUN - build and measure, but no R2 access at all
  # (no credentials needed, no upload, no publish), so the world files in orbis-osm and the app stay untouched
  push:
    branches: [claude/osm-planet]
  schedule:
    - cron: '17 3 1 * *'
  repository_dispatch:
    types: [osm-planet]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osm-planet
  cancel-in-progress: false

env:
  # R2 versteht die neuen Prüfsummen-Header der AWS-CLI nicht
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_DEFAULT_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nodes
            groups: points,trees
          - name: roofs
            groups: roofs
    steps:
      # fail before the hours of work, not after
      - name: R2 credentials
        if: github.event_name != 'push'
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo '::error::R2 credentials missing - the world files go to the bucket orbis-osm'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y --no-install-recommends osmium-tool
      - uses: ./.github/actions/tippecanoe
      # the planet is ~90 GB, the runner has ~88 GB free: remove preinstalled tools we do not need (measured: ~110 GB free afterwards)
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1
      - name: Build (download, filter, tippecanoe)
        run: |
          mkdir -p parts
          node collectors/osm-tiles.mjs build --groups "${{ matrix.groups }}" --out work --part "parts/${{ matrix.name }}.json"
          ls -laR work/dist
      - name: Summary
        if: always()
        run: |
          [ -f "parts/${{ matrix.name }}.json" ] || exit 0
          {
            echo "### ${{ matrix.name }}${{ github.event_name == 'push' && ' (dry run: nothing uploaded)' || '' }}"
            echo '| file | bytes | features |'
            echo '|---|---|---|'
            jq -r '.sets | to_entries[] | "| \(.key) | \(.value.bytes) | \(.value.features) |"' "parts/${{ matrix.name }}.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to R2 (orbis-osm), without meta.json
        if: github.event_name != 'push'
        run: |
          aws s3 sync work/dist s3://orbis-osm/ --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --cache-control "public, max-age=86400" --only-show-errors
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.name }}
          path: parts/${{ matrix.name }}.json
          retention-days: 3

  publish:
    needs: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: meta.json
        run: |
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          mkdir -p work
          aws s3 cp s3://orbis-osm/meta.json work/prev-meta.json --endpoint-url "$EP" --only-show-errors || echo '::notice::no meta.json in the bucket yet'
          aws s3 cp s3://orbis-osm/manifest.json work/manifest.json --endpoint-url "$EP" --only-show-errors || echo '{}' > work/manifest.json
          node collectors/osm-tiles.mjs publish parts dist --prev work/prev-meta.json --delete-list work/delete.txt --manifest work/manifest.json
          cat dist/meta.json | head -c 1500; echo
      - name: Publish (meta.json last = the switch), then manifest.json
        run: |
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp dist/LICENSE.txt s3://orbis-osm/LICENSE.txt --endpoint-url "$EP" --cache-control "public, max-age=86400" --only-show-errors
          aws s3 cp dist/meta.json s3://orbis-osm/meta.json --endpoint-url "$EP" --cache-control "public, max-age=3600" --content-type application/json --only-show-errors
          aws s3 cp work/manifest.json s3://orbis-osm/manifest.json --endpoint-url "$EP" \
            --cache-control "public, max-age=60, stale-while-revalidate=300" --content-type application/json --only-show-errors
      - name: Delete superseded versions (older than the CDN cache time)
        run: |
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          [ -s work/delete.txt ] || { echo 'nothing to delete'; exit 0; }
          while read -r key; do
            echo "delete $key"
            aws s3 rm "s3://orbis-osm/$key" --endpoint-url "$EP" --only-show-errors
          done < work/delete.txt
      - name: Summary
        run: |
          {
            echo '### OSM planet'
            echo "version: $(jq -r .version dist/meta.json), planet data of $(jq -r '.newest / 1000 | todate' dist/meta.json)"
            echo '| file | bytes | features |'
            echo '|---|---|---|'
            jq -r '.sets | to_entries[] | "| \(.key) | \(.value.bytes) | \(.value.features) |"' dist/meta.json
          } >> "$GITHUB_STEP_SUMMARY"
