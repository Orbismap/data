name: Assets manifest

# manifest.json for the bucket orbis-assets (models/, textures/, data/...). Nothing collects into this bucket, so the
# manifest is rebuilt from a listing of the bucket (collectors/assets-manifest.mjs): run it after every upload of assets
# (manually via "Run workflow") and weekly as a safety net. Needs R2 secrets (see README), no other secrets.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: assets-manifest
  cancel-in-progress: false

env:
  R2_BUCKET: ${{ vars.R2_BUCKET_ASSETS || 'orbis-assets' }}
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_DEFAULT_REGION: auto

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and upload manifest.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "::warning::R2 not configured - skipped"; exit 0; fi
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" --endpoint-url "$EP" --output json > listing.json
          node collectors/assets-manifest.mjs listing.json manifest.json
          aws s3 cp manifest.json "s3://$R2_BUCKET/manifest.json" --endpoint-url "$EP" \
            --cache-control "public, max-age=3600" --content-type application/json --only-show-errors
